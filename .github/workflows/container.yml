name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Sets KO_DOCKER_REPO=ghcr.io/<owner>/<repo> and logs in to ghcr.io
      # with GITHUB_TOKEN; it skips both when KO_DOCKER_REPO is preset.
      - uses: ko-build/setup-ko@v0.10

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          # metadata-action emits full references; ko wants bare tags.
          tags=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed 's/.*://' | paste -sd,)
          ko build --bare --push="$PUSH" --tags "$tags" \
            --image-label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --image-label org.opencontainers.image.revision="${{ github.sha }}" \
            --image-label org.opencontainers.image.version="$VERSION" \
            ./cmd/clatto
